<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Company OS Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: chat-first shell. 13px base, 28px controls, 6-18px radii.
   Every screen is a conversation. Agents surface cards inside the thread. Detail lives in a right-hand info panel. Humans = circles, AI = squares. */
:root{
  --bg:#10262e; --panel:#142b34; --raise:#19323c; --hover:#1f3b46; --line:rgba(214,238,243,.08); --line2:rgba(214,238,243,.15);
  --fg:#eef6f8; --mute:#a3b6bb; --faint:#86999e;
  --inv-bg:#eef6f8; --inv-fg:#061419;
  --ok:#5fc68b; --warn:#e7ab45; --bad:#ee6d58; --info:#00D4DE; --bar:#00D4DE; --bar2:rgba(0,212,222,.32);
  --okbg:rgba(95,198,139,.13); --warnbg:rgba(231,171,69,.13); --badbg:rgba(238,109,88,.13); --infobg:rgba(0,212,222,.12);
  --avS:32%; --avL:34%; --avFg:#ffffff; --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.45); --me-bg:rgba(0,212,222,.15); --me-solo:#1e3f4a; --mx-side:#0c0c0e; --mx-fg:#d4d4d8; --mx-mute:#8a8a92; --mx-hi:rgba(255,255,255,.10);
  --frame-edge:rgba(0,212,222,.28); --chrome:#001D25; --chrome-fg:#e8f4f6; --chrome-mute:rgba(232,244,246,.6); --chrome-hi:rgba(255,255,255,.09); --chrome-line:rgba(255,255,255,.13); --cyan:#00D4DE; --on-info:#001D25; --on-ok:#05230f;
  --r-sm:6px; --r:8px; --r-lg:12px; --r-xl:14px; --r-2xl:18px;
  --sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#ffffff; --panel:#f7f7f8; --raise:#ffffff; --hover:#efeff1; --line:#e7e7ea; --line2:#d8d8dd;
    --fg:#0b1c22; --mute:#55666b; --faint:#5c6c71; --inv-bg:#001D25; --inv-fg:#ffffff;
    --ok:#1a7a46; --warn:#8a5600; --bad:#c8402b; --info:#00767c; --on-info:#ffffff; --on-ok:#ffffff; --bar:#00a9b2; --bar2:rgba(0,169,178,.28);
    --okbg:rgba(31,143,82,.10); --warnbg:rgba(169,106,0,.10); --badbg:rgba(200,64,43,.09); --infobg:rgba(0,169,178,.10);
    --avS:42%; --avL:46%; --scrim:rgba(0,0,0,.28); --shadow:rgba(0,0,0,.14); --me-bg:rgba(0,169,178,.12); --me-solo:#e9f2f4; color-scheme:light;
    --l-social:#7a4fd0; --l-content:#b8467a;
  }
}
:root[data-theme="light"]{
  --bg:#ffffff; --panel:#f7f7f8; --raise:#ffffff; --hover:#efeff1; --line:#e7e7ea; --line2:#d8d8dd;
  --fg:#0b1c22; --mute:#55666b; --faint:#5c6c71; --inv-bg:#001D25; --inv-fg:#ffffff;
  --ok:#1a7a46; --warn:#8a5600; --bad:#c8402b; --info:#00767c; --on-info:#ffffff; --on-ok:#ffffff; --bar:#00a9b2; --bar2:rgba(0,169,178,.28);
  --okbg:rgba(31,143,82,.10); --warnbg:rgba(169,106,0,.10); --badbg:rgba(200,64,43,.09); --infobg:rgba(0,169,178,.10);
  --avS:42%; --avL:46%; --scrim:rgba(0,0,0,.28); --shadow:rgba(0,0,0,.14); --me-bg:rgba(0,169,178,.12); --me-solo:#e9f2f4; color-scheme:light;
  --l-social:#7a4fd0; --l-content:#b8467a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
::selection{background:rgba(0,212,222,.32)}
textarea,input{caret-color:var(--info)}
html{scrollbar-color:var(--line2) transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
.mute{color:var(--mute)} .faint{color:var(--faint)} .tnum,.stat .v,.hb .v,.dtable td{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:flex;flex-direction:column;height:100%;background:var(--chrome)}
.app{display:flex;flex:1;min-height:0}
.frame{flex:1;min-width:0;display:flex;min-height:0;background:var(--bg);border-radius:16px;overflow:hidden;margin:0 20px 20px 0;box-shadow:0 0 0 1px var(--frame-edge)}
.app.is-onb .frame{margin:0;border-radius:0;box-shadow:none}
.side{width:256px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 4px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center;flex:none}
.brand b{font-weight:600;font-size:14px}
.brand small{display:block;font-size:12px;color:var(--faint);margin-top:-2px}
.side-scroll{flex:1;overflow-y:auto;padding:6px 8px 10px}
.newchat{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);margin:10px 8px 6px;padding:8px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--raise);font-weight:500}
.newchat:hover{background:var(--hover)}
.nav-l{font:500 12px var(--sans);color:var(--faint);padding:14px 10px 4px}
.sec-h{display:flex;align-items:center;gap:4px;width:100%;text-align:left;padding-left:4px;border-radius:6px}
.sec-h:hover{color:var(--fg)}
.ni{display:flex;align-items:center;gap:10px;width:100%;min-height:30px;padding:4px 10px;border-radius:var(--r);color:var(--mute);text-align:left}
.ni:hover{background:var(--hover);color:var(--fg)}
.ni.on{background:var(--hover);color:var(--fg);font-weight:500}
.ni .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni.cos{color:var(--fg);font-weight:500}
.kbd{font:500 11px var(--mono);color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:0 5px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.bad{background:var(--bad)} .dot.info{background:var(--info)} .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:9px}
.side-foot .who{flex:1;min-width:0;line-height:1.25}
.side-foot .who b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{font-size:12px;color:var(--faint)}
.iconbtn{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;color:var(--mute);position:relative;flex:none}
.iconbtn:hover,.iconbtn.on{background:var(--hover);color:var(--fg)}
.iconbtn .dot{position:absolute;top:5px;right:5px}
.role{display:flex;border:1px solid var(--line2);border-radius:999px;padding:2px;gap:2px;margin:0 12px 10px}
.role button{flex:1;font-size:12px;padding:3px 8px;border-radius:999px;color:var(--mute);white-space:nowrap}
.role button.on{background:var(--inv-bg);color:var(--inv-fg)}
.role-l{font:500 12px var(--sans);color:var(--faint);padding:6px 14px 4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.chead{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:1px solid var(--line)}
.chead .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.chead .ttl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .ttl small{color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.body{flex:1;min-height:0;display:flex}
.chatcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.thread{flex:1;overflow-y:auto;min-height:0}
.inner{padding:24px 28px 12px}
.dock{flex:none;padding:6px 28px 16px}

/* avatars + bits */
.av{display:inline-grid;place-items:center;flex:none;font-weight:600;letter-spacing:.02em}
.av.ag{border-radius:7px;background:hsl(var(--hue) var(--avS) var(--avL));color:var(--avFg)}
.av.hu{border-radius:50%;background:var(--raise);border:1px solid var(--line2);color:var(--fg)}
.av.cs{border-radius:7px;background:var(--cyan);color:var(--chrome)}
.stack{display:flex}
.stack .av{box-shadow:0 0 0 2px var(--bg);margin-left:-5px}
.stack .av:first-child{margin-left:0}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--inv-bg);color:var(--inv-fg);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){opacity:.9}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--hover);opacity:1}
/* one solid button per card; the rest read as text so the main action is the only thing that stands out (Von Restorff), while Pass and Undo stay one visible click (ux-canon laws #1, #20) */
.cd-f .btn.ghost,.crow .acts .btn.ghost,.inl .btn.ghost,.ip .chips .btn.ghost,.posthead .chips .btn.ghost{background:none;border:0;padding:0 8px;color:var(--mute);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.cd-f .btn.ghost:hover,.crow .acts .btn.ghost:hover,.inl .btn.ghost:hover,.ip .chips .btn.ghost:hover,.posthead .chips .btn.ghost:hover{background:none;color:var(--fg);text-decoration-color:currentColor}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--fg);text-align:left}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--inv-bg);color:var(--inv-fg);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--sans);padding:1px 8px;border-radius:999px;white-space:nowrap;color:var(--mute);border:1px solid var(--line2)}
.pill.ok{color:var(--ok);background:var(--okbg);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warnbg);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--badbg);border-color:transparent}
.pill.info{color:var(--info);background:var(--infobg);border-color:transparent}
.link{color:var(--mute);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.link:hover{color:var(--fg)}
.back{display:inline-flex;gap:4px;align-items:center;color:var(--mute);margin-bottom:12px}
.back:hover{color:var(--fg)}

/* composer */
.composer{background:var(--raise);border:1px solid var(--line2);border-radius:var(--r-2xl);padding:10px 10px 8px 16px}
.composer:focus-within{border-color:var(--faint)}
.composer textarea{width:100%;border:0;background:transparent;resize:none;outline:none;font-size:14px;line-height:1.45;min-height:24px;max-height:180px;display:block}
.composer .bar{display:flex;align-items:center;gap:6px;margin-top:6px}
.composer .bar .grow{flex:1}
.composer .hint{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:5px}
.send{width:32px;height:32px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center;flex:none}

/* empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;gap:6px;min-height:100%}
.empty h1{font-size:28px;letter-spacing:-.02em;margin-top:12px}
.empty p{color:var(--mute);max-width:46ch}
.empty .composer{width:100%;max-width:680px;margin-top:22px;text-align:left}
.empty .chips{justify-content:center;margin-top:14px;max-width:680px}

/* messages */
.msgs{display:flex;flex-direction:column;gap:26px}
.m{display:flex;gap:11px;align-items:flex-start}
.m .mb{flex:1;min-width:0}
.m .who{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px;margin-bottom:2px}
.m .who small{font-weight:400;color:var(--faint);font-size:12px}
.m .tx{font-size:14px;line-height:1.55}
.m:not(.me) .tx{display:inline-block;max-width:min(100%,72ch);background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:4px 16px 16px 16px}
.m .tx p+p{margin-top:8px}
.m .tx ul{margin:6px 0 0;padding-left:18px}
.m .tx li{margin:2px 0}
.m.me{justify-content:flex-end}
.m.me .bub{max-width:min(72%,72ch);background:var(--me-bg);padding:9px 14px;border-radius:16px 4px 16px 16px;font-size:14px}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.daysep{text-align:center;font:500 12px var(--sans);color:var(--faint);letter-spacing:.05em}
.greet{text-align:center;padding:14px 0 30px}
.greet h1{font-size:24px;margin-top:12px}
.greet p{color:var(--mute);margin-top:3px}

/* cards */
.cd{margin-top:10px;max-width:600px;border:1px solid var(--line2);border-radius:var(--r-lg);background:var(--panel);overflow:hidden}
.cd-h{display:flex;align-items:center;gap:7px;padding:10px 14px 0;font:500 12px var(--sans);color:var(--faint)}
.cd-h .grow{flex:1}
.cd-b{padding:6px 14px 12px}
.cd-b .t{font-weight:600;font-size:14px}
.cd-b .s{color:var(--mute);font-size:12.5px;margin-top:1px}
.cd-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.cd-f .note{font-size:12.5px;color:var(--mute);display:inline-flex;gap:6px;align-items:center}
.cd.done .cd-f{color:var(--ok)}
.cd ul{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:12.5px}
.prev-txt{margin-top:8px;padding:10px 12px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line);font-size:13px}
.opts{display:grid;gap:6px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line2);background:var(--raise)}
.opt:hover:not(:disabled){background:var(--hover)}
.opt .n{font:500 12px var(--sans);color:var(--faint);width:14px;flex:none}
.opt.picked{border-color:var(--fg);opacity:1}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);margin-top:10px}
.meter .tr{flex:1;max-width:160px;height:4px;border-radius:99px;background:var(--line2);overflow:hidden}
.meter .tr i{display:block;height:100%;background:var(--fg)}
.file{display:flex;gap:12px;align-items:center;padding:11px 14px;width:100%;text-align:left}
button.file:hover{background:var(--hover)}
.fi{width:34px;height:40px;border-radius:6px;display:grid;place-items:center;font:600 10px var(--mono);color:#ffffff;flex:none}
.fi.pdf{background:#c2412d}.fi.docx{background:#2b5fb4}.fi.pptx{background:#c1592b}.fi.xlsx{background:#237a49}.fi.png{background:#7a4fb8}.fi.html{background:#55555c}
.file .grow{flex:1;min-width:0}
.file .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .s{color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files>.file+.file{border-top:1px solid var(--line)}
.diff{display:grid;gap:3px;padding:8px 14px 12px;font-size:12.5px}
.diff .k{font:500 12px var(--sans);color:var(--faint)}
.diff .was{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl td{padding:7px 14px;border-top:1px solid var(--line);vertical-align:top}
.ox{overflow-x:auto}
.field{display:grid;gap:3px}
.field label{font-size:12px;color:var(--mute)}
.field input{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:6px 9px;width:100%}
.sig{background:#ffffff;color:#16161a;border-radius:var(--r);padding:16px 18px;border:1px solid var(--line)}
.sig .nm{font-weight:700;font-size:14px}
.sig .tt{font-size:12px;color:#55555c}
.sig hr{border:0;border-top:2px solid #16161a;width:30px;margin:9px 0}
.sig .ln{font-size:12px;color:#33333a}
.sig .wm{font-weight:700;letter-spacing:.18em;font-size:11px;margin-top:9px}
.sig-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;margin-top:8px}
.thumb{border-radius:var(--r);display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;color:#ffffff;background:linear-gradient(135deg,#1d3c63,#0f2236);font-weight:700;letter-spacing:-.01em;position:relative;overflow:hidden;max-width:100%}
.thumb small{font-weight:500;opacity:.8;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.thumb::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(255,255,255,.08)}
.thumb.lite{background:linear-gradient(160deg,#f4f4f6,#e3e5ea);color:#141418}
.thumb.lite::after{border-color:rgba(0,0,0,.05)}

/* charts: single series, one hue, direct labels, recessive grid, hover values via title */
.hb{display:grid;grid-template-columns:minmax(80px,max-content) 1fr auto;gap:8px 10px;align-items:center;margin-top:12px;font-size:12.5px}
.hb .l{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.hb .tr{height:14px;position:relative;border-left:1px solid var(--line2)}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.hb .tr:hover i{filter:brightness(1.15)}
.hb .v{font-variant-numeric:tabular-nums;text-align:right}
.cols{position:relative;height:160px;margin-top:22px;display:flex;align-items:flex-end;gap:6px;padding-bottom:20px;border-bottom:1px solid var(--line2)}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.cols .c i{width:100%;max-width:26px;background:var(--bar2);border-radius:4px 4px 0 0}
.cols .c.last i,.cols .c:hover i{background:var(--bar)}
.cols .c span{position:absolute;bottom:-19px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.cols .c b{position:absolute;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.goal{position:absolute;left:0;right:0;border-top:1px dashed var(--mute);pointer-events:none}
.goal span{position:absolute;left:0;top:-17px;font-size:11px;color:var(--mute);font-family:var(--mono)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
.stat .k{font-size:12px;color:var(--faint)}
.stat .v{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px}
.d.up{color:var(--ok)} .d.dn{color:var(--bad)}
.src{font-size:12px;color:var(--faint);margin-top:12px}

/* group chats: grouped messages, one-line cards, catch-up, ask row, @ menu */
.msgs.grp{gap:16px}
.m.cont{margin-top:-10px}
.m .avsp{width:30px;flex:none}
.at{color:var(--info);font-weight:500}
.fchip{display:inline-flex;align-items:center;gap:8px;margin:8px 6px 0 0;padding:4px 10px 4px 4px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);max-width:100%;text-align:left}
.fchip:hover{background:var(--hover)}
.fchip .fi{width:22px;height:26px;font-size:7px;border-radius:4px}
.fchip .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}

/* posts */

.posts{display:grid;gap:10px}
.post{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-radius:var(--r-lg);background:var(--panel);padding:14px 16px}

.post .prog{margin-top:10px;max-width:260px}
.posthead{border:1px solid var(--line2);border-radius:var(--r-lg);background:var(--panel);padding:16px 18px;margin-bottom:22px}
.posthead h1{font-size:20px}
.posthead .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:12.5px;margin-top:6px}
.posthead .prog{margin-top:12px;max-width:320px}
.replies-l{font:500 12px var(--sans);color:var(--faint);margin:0 0 14px}

/* Slack / Teams previews (generic mocks, no logos) */
.viewsel{background:var(--raise);border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg);max-width:150px}

.mx{display:flex;flex:1;min-width:0;min-height:0}

.mock{font:600 9.5px var(--mono);color:var(--mx-mute);border:1px dashed var(--mx-mute);border-radius:4px;padding:1px 5px;margin-left:auto}
.mx-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}

.mx-head b{font-size:15px}
.mx-head small{color:var(--faint);font-size:12px;display:flex;align-items:center;gap:5px}
.mx-list{flex:1;overflow-y:auto;min-height:0;padding:10px 0 6px}
.mx-banner{display:flex;align-items:center;gap:10px;margin:10px 18px 0;padding:9px 12px;border-radius:8px;background:var(--warnbg);font-size:12.5px;flex-wrap:wrap}
.mx-banner .grow{flex:1;min-width:180px}
.sm{display:flex;gap:10px;padding:7px 18px}
.sm:hover{background:var(--panel)}
.sm .mb{flex:1;min-width:0}
.sm .nm{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}

.app-b{font:600 9.5px var(--sans);background:var(--raise);border:1px solid var(--line2);padding:0 4px;border-radius:3px;color:var(--mute);align-self:center}
.tx2{font-size:14px;line-height:1.5;max-width:80ch}
.tx2 ul{margin:4px 0 0;padding-left:18px}

.eph-l{font-size:12px;color:var(--mute);display:flex;gap:5px;align-items:center}
.blk{border-left:3px solid var(--line2);padding:4px 0 4px 12px;margin-top:6px;max-width:600px;font-size:13px}

.mbtn{display:inline-flex;height:28px;align-items:center;padding:0 12px;border:1px solid var(--line2);border-radius:6px;font-weight:600;font-size:12.5px;margin:8px 6px 0 0;background:var(--bg)}

.okline{display:inline-flex;gap:5px;align-items:center;color:var(--ok);font-size:12.5px;margin-top:8px}
.mfile{display:flex;gap:10px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:8px 12px 8px 8px;margin-top:6px;max-width:380px;width:100%;text-align:left;background:var(--panel)}
.mfile:hover{background:var(--hover)}
.mfile b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfile small{color:var(--faint);font-size:12px}
.mfile span:last-child{min-width:0}
.thr{display:inline-flex;gap:8px;align-items:center;margin-top:6px;padding:3px 8px 3px 3px;border-radius:6px;color:var(--info);font-weight:600;font-size:12.5px}
.thr:hover{background:var(--panel);box-shadow:0 0 0 1px var(--line2)}
.thr .faint{font-weight:400}
.mx-comp{flex:none;margin:6px 18px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--raise)}

.mx-send{height:26px;padding:0 10px;border-radius:5px;background:var(--ok);color:var(--on-ok);font-weight:600;font-size:12px}

.mx-thread{width:380px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}

.tm-rail{width:62px;flex:none;background:var(--mx-side);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px;color:var(--mx-mute)}

.tm-post{border:1px solid var(--line2);border-radius:8px;background:var(--panel);margin:0 18px 14px;overflow:hidden}

.tm-more{display:block;padding:7px 16px 7px 30px;color:var(--info);font-size:12.5px;font-weight:600;text-align:left;width:100%;border-top:1px solid var(--line)}

@media (max-width: 1000px){ .mx-side,.tm-list{display:none} }
@media (max-width: 820px){ .mx-thread{position:fixed;inset:0;width:100%;z-index:36} .tm-rail{display:none} }

/* chief of staff: hand-offs, focus, waiting-on-you */
.steps2{display:flex;gap:4px;margin-top:12px}
.steps2 span{flex:1;font-size:11px;color:var(--faint);border-top:3px solid var(--line2);padding-top:5px;transition:border-color .3s,color .3s}

.focusbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:7px 12px;border-radius:var(--r-lg);background:var(--infobg);font-size:12.5px}

.outstrip{display:inline-flex;align-items:center;gap:8px;margin:14px auto 0;padding:6px 14px 6px 8px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px;color:var(--mute);background:var(--panel)}

.inl{display:flex;gap:8px;flex-wrap:wrap}
.inl input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:6px 10px}
.wrapg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px;font-size:12.5px}
.wrapg ul{margin:0;padding-left:16px;color:var(--mute)}
.wrapg .k{font:600 12.5px var(--sans);color:var(--fg);margin-bottom:3px}
@media (max-width: 820px){ .share,.wrapg{grid-template-columns:1fr} }

/* top bar */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px 0 16px;background:var(--chrome);color:var(--chrome-fg);position:relative;z-index:42}
.topbar .logo{background:var(--cyan);color:var(--chrome)}
.topbar .faint{color:var(--chrome-mute)}
.topbar .iconbtn{color:var(--chrome-mute)}

.topbar .tb-user:hover,.topbar .tb-user.on{background:var(--chrome-hi)}

.topbar .tb-search .box{background:rgba(255,255,255,.07);border-color:var(--chrome-line);color:var(--chrome-mute)}

.tb-brand{display:flex;align-items:center;gap:9px;width:300px;flex:none;min-width:0}
.tb-brand b{font-weight:600;white-space:nowrap}
.tb-brand .faint{font-size:12px;white-space:nowrap}
.tb-search{flex:1;max-width:560px;margin:0 auto;position:relative;min-width:0}
.tb-search .box{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border:1px solid var(--line2);border-radius:var(--r-lg);background:var(--bg);color:var(--faint)}

.tb-search input{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;color:var(--fg)}
.qs-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-lg);box-shadow:0 16px 50px var(--shadow);padding:6px;max-height:60vh;overflow-y:auto}
.qs-drop .ir{border:0;border-radius:var(--r)}
.qs-drop .ir.hot{background:var(--hover)}
.qs-drop .grp{font:500 12px var(--sans);color:var(--faint);padding:8px 10px 4px}
.tb-right{display:flex;align-items:center;gap:4px;flex:none}
.badge-n{position:absolute;top:2px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:#ffffff;font:600 11px var(--sans);display:grid;place-items:center}
.tb-user{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 3px;border-radius:999px;margin-left:4px}
.tb-user:hover,.tb-user.on{background:var(--hover)}
.tb-user b{font-weight:500;white-space:nowrap}
.tb-pop{position:absolute;top:calc(100% + 6px);right:12px;width:min(380px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-xl);box-shadow:0 20px 60px var(--shadow);overflow:hidden}
.tb-pop .ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tb-pop .ph b{flex:1}
.tb-pop .pl{max-height:60vh;overflow-y:auto}
.nrow{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.nrow:first-child{border-top:0}

.nrow .grow{flex:1;min-width:0}

.nrow .when{font-size:11px;color:var(--faint);white-space:nowrap}
.udot{width:8px;height:8px;border-radius:50%;background:var(--info);flex:none;margin-top:6px}
.umenu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;text-align:left;color:var(--fg)}
.umenu .mi:hover{background:var(--hover)}
.umenu .mi svg{color:var(--mute)}
.umenu .sep{border-top:1px solid var(--line);margin:4px 0}

@media (max-width: 1000px){ .tb-brand{width:auto} .tb-brand .faint{display:none} }
@media (max-width: 820px){ .tb-user b,.tb-search kbd,.tb-user .faint,.tb-brand{display:none} .topbar{gap:4px;padding:0 10px} .tb-right .iconbtn[data-a="settings"]{display:none} .chead .menu-btn,.ws-head .menu-btn{display:none!important} .chead .viewsel{display:none} .chead .chip{font-size:0;gap:0;padding:6px 8px} .chead{padding:0 8px 0 12px} }

/* 1:1 chats */
.chead.flat{border-bottom:0}
.chatcol.solo .inner{max-width:800px;margin:0 auto;padding:28px 24px 16px}
.chatcol.solo .dock{padding:6px 24px 18px}
.chatcol.solo .dock>*{max-width:800px;margin-left:auto;margin-right:auto}
.chatcol.solo .msgs{gap:30px}
.chatcol.solo .m:not(.me) .tx{display:block;background:none;border:0;padding:0;max-width:65ch;font-size:15px;line-height:1.65}
.chatcol.solo .m.me .bub{background:var(--me-solo);border-radius:22px;padding:10px 18px;max-width:min(75%,620px);font-size:15px}

.macts button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.macts button:hover{background:var(--hover);color:var(--fg)}
.macts button.on{color:var(--fg)}
.tgl{display:inline-flex;gap:6px;align-items:center;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;color:var(--mute);white-space:nowrap}
.tgl:hover{color:var(--fg);background:var(--hover)}
.tgl.on{background:var(--infobg);color:var(--info);border-color:transparent}

/* rail + workspaces */
.rail{width:70px;flex:none;background:var(--chrome);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail .logo{margin-bottom:10px}
.rl{width:60px;padding:7px 0 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:11px;letter-spacing:-.01em;position:relative}
.rl{color:var(--chrome-mute)}

.ws-page{flex:1;min-width:0;overflow-y:auto;padding:22px 28px 60px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--mute);margin-bottom:14px;font-size:12.5px}

const WIKI = [
  {id:'welcome', sec:'Start here', t:'Welcome to Halden', own:'theo', upd:'Sep 30', body:`<p>Halden makes sensors and software that warn a plant before a line stops. We sell to plant and operations leaders in food, metal fab and packaging, mostly in the Midwest.</p><p>We're about 45 people. Most of us have worked in or around plants, which is why customers trust us. Keep that in how you write and how you sell: talk like someone who's stood on the floor.</p><h2>How work happens here</h2><ul><li>Every team has AI teammates. They do the first draft, the research and the follow-up. People make the calls.</li><li>Projects run in a channel, with their own thread and their own board in Tasks.</li><li>Your Assistant is private to you. Use it for anything, including the questions you'd feel silly asking a person.</li></ul><div class="note">New here? Start with <b>Your first week</b>, then <b>Working with AI teammates</b>.</div>`},
  {id:'first-week', sec:'Start here', t:'Your first week', own:'ruth', upd:'Oct 2', body:`<ol><li><b>Day 1:</b> laptop, accounts and a tour with your manager. Connect your personal context to your Assistant if you want to; it's optional and private.</li><li><b>Day 2:</b> read <b>What we do and who for</b> and <b>Brand basics</b>.</li><li><b>Day 3:</b> sit in on a customer call. Ask Sales Desk for the prep pack first.</li><li><b>Day 4:</b> visit a customer plant if one is close. Dana books these.</li><li><b>Day 5:</b> 30 minutes with your manager: what's clear, what isn't.</li></ol><p>If you can't find something, press <b>⌘K</b> and ask. It knows who owns what.</p>`},
  {id:'whos-who', sec:'Start here', t:"Who's who", own:'ruth', upd:'Oct 12', body:`<p>The short version. Press <b>⌘K</b> any time to find who owns something.</p><ul><li><b>Theo Lindqvist</b>, CEO. Strategy, the board, spend over $5,000.</li><li><b>Priya Shah</b>, Head of Marketing. Brand, content, events budget, marketing spend.</li><li><b>Marcus Reed</b>, VP Sales. Pipeline, pricing exceptions, big accounts.</li><li><b>Lena Ortiz</b>, Head of Product. Roadmap, pricing, competitors.</li><li><b>Dana Kowalski</b>, Events. Shows, booths, plant visits.</li><li><b>Ruth Abernathy</b>, People and HR. Time off, benefits, hiring.</li><li><b>Sam Cho</b>, Finance. Invoices, expenses, budgets.</li></ul><h2>AI teammates</h2><p>Eight of them, one per area: Content, Events, Demand Gen, Sales Desk, Brand and Design, Product Marketing, RevOps, and Ops and Admin. Anyone can message them. Only admins can change how they work.</p>`},
  {id:'what-we-do', sec:'Company', t:'What we do and who for', own:'lena', upd:'Sep 18', used:['content','sales','pmm'], body:`<h2>The problem</h2><p>Most mid-size plants find out a line is down from the line. Every unplanned stop costs hours of output and a scramble for parts and people.</p><h2>What we do</h2><p>Our sensors watch the machines that fail most. The software spots drift days before a stop and tells maintenance which machine, and what to check.</p><h2>Who buys</h2><ul><li>Plant managers and VPs of operations at 1 to 10 sites</li><li>Food and beverage, metal fab, packaging</li><li>Usually after a bad quarter of downtime</li></ul><h2>Who we're up against</h2><p>Fabrix (cheaper, single-site), Linewise (big plants), and spreadsheets. We win on multi-line plants and on how fast maintenance acts on an alert.</p>`},
  {id:'brand-basics', sec:'Brand', t:'Brand basics', own:'priya', upd:'Oct 5', used:['content','brand','demand'], body:`<ul><li>Write like a person who has worked in a plant. Plain words, short sentences.</li><li>Lead with the reader's problem, then what changed for a real customer.</li><li>Every number needs a source in <b>Approved claims</b>. If it isn't there, don't use it.</li><li>Never: "unlock", "leverage", "revolutionize", "seamless".</li><li>Use the templates in the brand kit. Layouts are locked so everything matches.</li></ul>`},
  {id:'expenses', sec:'Policies', t:'Expenses and approvals', own:'sam', upd:'Aug 30', body:`<ul><li>Under $500: just do it and send the receipt. Ops and Admin Lead files it.</li><li>$500 to $5,000: your manager approves. In practice that's an approval card in their Assistant.</li><li>Over $5,000: Theo approves.</li><li>Event spend comes out of the event's budget in its post. The Events Lead tracks it.</li></ul><p>Receipts: forward them to your Assistant or drop them in the Finance folder. They're filed within a day.</p>`},
  {id:'time-off', sec:'Policies', t:'Time off', own:'ruth', upd:'Jul 14', body:`<ul><li>20 days a year, plus statutory holidays.</li><li>Tell your manager and Ruth a week ahead for anything over two days.</li><li>Your Assistant can block your calendar and set your out-of-office. It will also hold non-urgent pings until you're back.</li></ul>`},
  {id:'ai-use', sec:'Policies', t:'Working with AI teammates', own:'priya', upd:'Oct 14', body:`<h2>Who decides</h2><p>AI teammates draft, research and follow up. People decide. Every job starts by asking before it ships, and earns more freedom only after 10 approvals with no edits. One edit moves it back a level.</p><h2>What stays private</h2><ul><li>Your Assistant chat and personal context are private to you. Admins can't read them.</li><li>When your Assistant hands work to a teammate, it shares only what the job needs, and shows you what it shared.</li></ul><h2>Changing how a teammate works</h2><p>Admins can tell a teammate in chat ("stop using hashtags") and it updates its own settings. Members can ask too; the change goes to an admin to approve. Every change can be undone.</p>`},
  {id:'event-playbook', sec:'SOPs', t:'Event playbook', own:'dana', upd:'Oct 1', used:['events'], body:`<ol><li><b>Decide:</b> is the show worth it? Check last year's results report first.</li><li><b>Start the project:</b> tell the Events Lead. It asks what's missing and builds the plan.</li><li><b>Six weeks out:</b> booth graphic, landing page, print orders (vendors need 3 weeks).</li><li><b>One week out:</b> announce post. <b>One day out:</b> reminder post.</li><li><b>After:</b> leads into the CRM within 24 hours, follow-up emails, recap post, results report.</li></ol><div class="note">Every event is a project in the Events Team channel. All files land in Events/YYYY-MM Event name.</div>`},
  {id:'publishing', sec:'SOPs', t:'Publishing a post', own:'priya', upd:'Sep 22', used:['content'], body:`<ol><li>Content Lead drafts from the calendar, using approved claims only.</li><li>A quality check scores it. Under 8 out of 10 goes back.</li><li>The owner approves. Company posts: Priya. Exec posts: the exec.</li><li>It's scheduled for the best slot, with a heads-up in GTM Team.</li></ol><p>Nothing posts without an approval until that job has earned trust.</p>`},
  {id:'story', sec:'Company', t:'Our story and this year\'s goals', own:'theo', upd:'Oct 3', used:['content','pmm'], body:`<p>Theo ran maintenance at a packaging plant in Toledo for eleven years. The worst nights were the ones where a line went down and nobody saw it coming. Halden started in 2019 to fix exactly that, for plants too small for the big enterprise systems.</p><h2>Where we are</h2><ul><li>About 45 people, based in Columbus, Ohio</li><li>Live in plants across five Midwest states</li><li>Most new revenue comes from customers adding lines and sites after the first one works</li></ul><h2>This year's three goals</h2><ol><li><b>15 new plants live</b> by December 31</li><li><b>Net revenue retention above 110%</b>: customers grow with us</li><li><b>Every alert acted on within 4 hours</b> at every customer</li></ol><div class="note">Every report in Reports ladders up to one of these three. If a piece of work doesn't, ask why we're doing it.</div>`},
  {id:'money', sec:'Company', t:'How we make money', own:'sam', upd:'Sep 12', used:['revops','sales'], body:`<ul><li>Customers pay a yearly subscription per site. Sensors, install and support are included.</li><li>A first deal is usually one plant, between $29,000 and $71,000 a year.</li><li>Growth comes from expansion: more lines in the same plant, then the customer's other plants.</li><li>We don't sell hardware on its own, and we don't charge for install.</li></ul><h2>What a healthy customer looks like</h2><ul><li>Acts on alerts within 4 hours</li><li>Adds a line or a site inside the first year</li><li>Renews without a discount</li></ul>`},
  {id:'product-overview', sec:'Product', t:'How Halden works', own:'lena', upd:'Oct 8', used:['content','sales','pmm','demand'], body:`<p>Three parts, sold as one subscription.</p><h2>1. Sensors</h2><ul><li>Clip-on vibration, temperature and current sensors</li><li>About 20 minutes per machine. No wiring into the machine's controls.</li><li>Washdown-rated for food plants</li></ul><h2>2. Alerts</h2><ul><li>Spots a machine drifting from normal, up to 9 days before it stops</li><li>Tells maintenance which machine, what's likely wrong, and what to check first</li><li>Goes to phones, Teams or Slack, or opens a work order on its own</li></ul><h2>3. Downtime reports</h2><ul><li>Every stop logged with its cause and its cost</li><li>A weekly one-page report for the plant manager</li></ul><h2>What it isn't</h2><p>It doesn't run machines, replace a maintenance system, or track production orders. If a prospect needs those, they need a different product as well.</p>`},
  {id:'pricing', sec:'Product', t:'Plans and pricing', own:'lena', upd:'Oct 16', used:['sales','pmm'], body:`<table><thead><tr><th>Plan</th><th>For</th><th>Price</th></tr></thead><tbody><tr><td><b>Starter</b></td><td>1 site, up to 3 lines</td><td>$790 a month</td></tr><tr><td><b>Plant</b></td><td>1 site, up to 12 lines</td><td>$2,400 a month</td></tr><tr><td><b>Multi-site</b></td><td>2 sites or more</td><td>Quoted, volume pricing</td></tr></tbody></table><h2>Rules</h2><ul><li>Annual contract, billed yearly. Sensors and install included.</li><li><b>Paid pilot:</b> 60 days on one line for $1,500, credited to year one if they sign.</li><li><b>Discounts:</b> up to 10% the rep decides, 10 to 20% Marcus, over 20% Theo.</li><li>Never free pilots. People who don't pay don't show up to the review.</li></ul><div class="note">Fabrix starts at $499 a month. Don't race them on price. See <b>Competitors</b> for how we win.</div>`},
  {id:'integrations', sec:'Product', t:'Integrations', own:'lena', upd:'Sep 29', used:['sales','pmm'], body:`<table><thead><tr><th>Kind</th><th>Works with</th><th>What it does</th></tr></thead><tbody><tr><td>Maintenance systems</td><td>Fiix, UpKeep, MaintainX, Limble, SAP PM</td><td>Opens a work order from an alert</td></tr><tr><td>Messaging</td><td>Microsoft Teams, Slack, text message</td><td>Sends alerts to the crew</td></tr><tr><td>Reporting</td><td>Power BI, CSV export, open API</td><td>Downtime data in their own reports</td></tr><tr><td>Plant data (optional)</td><td>Ignition, AVEVA PI</td><td>Read-only, adds production context</td></tr></tbody></table><p>Not on the list? Ask Lena before promising it. Most requests take a sprint, some never happen.</p>`},
  {id:'install', sec:'Product', t:'Install and the first 30 days', own:'lena', upd:'Sep 20', used:['sales','content'], body:`<ol><li><b>Day 0:</b> site walk, often on a video call. We pick the machines that stop most.</li><li><b>Week 1:</b> sensors go on, about one line a day. No downtime needed.</li><li><b>Weeks 2 and 3:</b> Halden learns what normal looks like. No alerts yet, on purpose.</li><li><b>Day 21:</b> first alerts.</li><li><b>Day 30:</b> review with the plant manager: what it caught, how accurate it was, which lines are next.</li></ol><div class="note">Set this expectation in every demo: the first real catch usually lands inside 6 weeks, not on day one.</div>`},
  {id:'security', sec:'Product', t:'Security and data', own:'lena', upd:'Aug 22', used:['sales'], body:`<ul><li>Sensors talk through their own cellular gateway. Nothing touches the plant network.</li><li>Read-only. Halden can never start, stop or change a machine.</li><li>Data is encrypted in transit and at rest, and hosted in the US.</li><li>SOC 2 Type II. The report is shared under NDA on request.</li><li>Customers own their data and can export all of it at any time.</li></ul><p>Most IT reviews take one call. Send IT the one-page security sheet from Sales Enablement before that call.</p>`},
  {id:'roadmap', sec:'Product', t:'Roadmap', own:'lena', upd:'Oct 10', used:['pmm','sales'], body:`<h2>Now (this quarter)</h2><ul><li>Suggested spare parts in each alert</li><li>Two-way sync with Fiix</li></ul><h2>Next</h2><ul><li>One view across every site for multi-site customers</li><li>Alerts in Spanish</li></ul><h2>Later</h2><ul><li>Energy use per line</li></ul><div class="note">Never promise a date to a customer. Say it's on the roadmap, then tell Lena who asked. Requests with a named account move up.</div>`},
  {id:'ind-food', sec:'Industries', t:'Food and beverage', own:'priya', upd:'Oct 9', used:['content','sales','demand','events'], body:`<h2>Why they buy</h2><ul><li>A stopped line means wasted product, a full sanitation restart and missed retailer windows</li><li>Food safety audits punish surprises</li></ul><h2>Machines we watch</h2><p>Fillers, mixers, ovens, conveyors, refrigeration compressors and the packaging line at the end.</p><h2>Their words</h2><p>Line stop, changeover, sanitation, OEE, co-man. Say "line stop", not "downtime event".</p><h2>Best proof</h2><p>Midstate Foods, Columbus: 11 stops avoided in the first 90 days. See <b>Customer stories</b>.</p><h2>Where they gather</h2><p>Ohio Food Safety Summit, Midwest Plant Expo, regional food processors associations.</p><div class="note">Our sensors are washdown-rated. Say so early; it's the first question a food plant asks.</div>`},
  {id:'ind-metal', sec:'Industries', t:'Metal fabrication', own:'priya', upd:'Oct 9', used:['content','sales','demand'], body:`<h2>Why they buy</h2><ul><li>One press or spindle down can stop a whole cell</li><li>Replacement parts can take weeks to arrive</li></ul><h2>Machines we watch</h2><p>Presses, CNC spindles, welders, hydraulics and compressors.</p><h2>Their words</h2><p>Cell, spindle, press, uptime, job shop, lead time.</p><h2>Best proof</h2><p>A three-site stamping shop in Indiana caught two press bearing failures in its first month. It can't be named; describe it, don't name it.</p><div class="note">Job shops watch every dollar. Lead with Starter and the paid pilot, not the Plant plan.</div>`},
  {id:'ind-pack', sec:'Industries', t:'Packaging', own:'priya', upd:'Oct 9', used:['content','sales','demand'], body:`<h2>Why they buy</h2><ul><li>Lines run around the clock, so there's no quiet time to fix things</li><li>Contracts carry penalties for late delivery</li></ul><h2>Machines we watch</h2><p>Corrugators, case erectors, case packers, palletizers and extruders.</p><h2>Their words</h2><p>Corrugator, palletizer, uptime, on time in full.</p><h2>Best proof</h2><p>Northline Packaging went from one line to all three of its sites in 8 months.</p>`},
  {id:'buyer-plant', sec:'Buyers', t:'Plant manager', own:'marcus', upd:'Oct 6', used:['sales','content','demand'], body:`<p><b>Usually the champion.</b> They feel every stop first and answer for the output number.</p><h2>What they care about</h2><ul><li>Hitting output without heroics</li><li>Not getting the 2 a.m. phone call</li></ul><h2>What they ask</h2><ul><li>"How many false alarms will my crew get?"</li><li>"Who installs it, and does it stop my lines?"</li></ul><h2>What to show</h2><ul><li>Their own downtime cost: hours stopped last quarter times what an hour costs them</li><li>The 60-day paid pilot on their worst line</li></ul><h2>What kills the deal</h2><p>It looks like another IT project, or the maintenance crew thinks it means more work.</p>`},
  {id:'buyer-vpops', sec:'Buyers', t:'VP of operations', own:'marcus', upd:'Oct 6', used:['sales','pmm'], body:`<p><b>Usually signs.</b> Runs several plants and gets compared on all of them.</p><h2>What they care about</h2><ul><li>Seeing every plant the same way</li><li>Payback they can defend to the CEO and finance</li></ul><h2>What they ask</h2><ul><li>"What's the payback?"</li><li>"Can I roll this out to every site without a big project?"</li></ul><h2>What to show</h2><ul><li>The pilot results from one plant, then the cost of rolling out to the rest</li><li>Payback math, using only numbers from <b>Approved claims</b></li></ul>`},
  {id:'buyer-maint', sec:'Buyers', t:'Maintenance lead', own:'marcus', upd:'Oct 6', used:['sales','content'], body:`<p><b>Uses it every day, and can quietly kill it.</b> If maintenance doesn't trust the alerts, nobody acts on them.</p><h2>What they care about</h2><ul><li>Knowing what to fix before it breaks</li><li>Fewer emergency calls, fewer rush-ordered parts</li></ul><h2>What they ask</h2><ul><li>"Is this going to make more work for my guys?"</li><li>"Does it go into our work order system?"</li></ul><h2>What to show</h2><p>A real alert: the machine, the likely cause, what to check first, and the work order it opened on its own.</p><div class="note">Get the maintenance lead into the demo. Deals without them close 40% less often.</div>`},
  {id:'buyer-finance', sec:'Buyers', t:'Finance', own:'marcus', upd:'Oct 6', used:['sales'], body:`<p><b>Approves the spend.</b> Usually the controller or CFO.</p><h2>What they care about</h2><p>What an hour of downtime really costs, how fast the subscription pays for itself, and the contract terms.</p><h2>What to show</h2><ul><li>Cost per hour of downtime times the stops we'd expect to catch</li><li>Annual contract, no hardware to buy, no install fee</li></ul>`},
  {id:'buyer-it', sec:'Buyers', t:'IT and security', own:'marcus', upd:'Oct 6', used:['sales'], body:`<p><b>Can block the deal, rarely starts it.</b></p><h2>What they ask</h2><ul><li>"Does it touch our network?" No, it uses its own cellular gateway.</li><li>"Can it change a machine?" No, it's read-only.</li><li>"Where does the data live?" US hosting, SOC 2 Type II.</li></ul><p>Send the security sheet before the call. See <b>Security and data</b>.</p>`},
  {id:'gtm-strategy', sec:'Go-to-market', t:'Go-to-market strategy', own:'priya', upd:'Oct 12', used:['content','demand','events','sales','revops'], body:`<h2>Who we go after</h2><ul><li>Plants with 100 to 1,000 people, at 1 to 10 sites</li><li>Food and beverage, metal fabrication, packaging</li><li>Midwest first: Ohio, Indiana, Michigan, Illinois, Wisconsin</li><li>Best sign: a costly line stop in the last 12 months</li></ul><h2>How we win them</h2><ol><li><b>Land:</b> a 60-day paid pilot on their worst line</li><li><b>Prove:</b> a real catch, with the cost it saved</li><li><b>Expand:</b> the rest of the plant, then their other plants</li></ol><h2>Where meetings come from, in order</h2><ol><li>Webinars and LinkedIn: our best cost per meeting</li><li>Regional events, only shows with a good results report</li><li>Customer referrals</li><li>Outbound to plants that look like our best customers</li></ol><h2>This quarter's targets</h2><ul><li>20 booked meetings a week</li><li>$1.2M in new pipeline</li><li>250 registrants for the Dec 3 webinar</li></ul><h2>What we don't chase</h2><p>Plants over 5,000 people, industries outside our three, and anyone who wants a free pilot.</p>`},
  {id:'positioning', sec:'Go-to-market', t:'Positioning and messaging', own:'priya', upd:'Oct 12', used:['content','demand','pmm','brand'], body:`<h2>What customers use instead</h2><p>Walk-arounds and spreadsheets, Fabrix, Linewise, or living with it.</p><h2>What only we do</h2><ul><li>Alerts that say what to check, not just that something's off</li><li>Installed in a day per line, without touching the controls</li><li>Built by people who ran plant maintenance</li></ul><h2>Why that matters to them</h2><p>Fewer surprise stops, and a crew that fixes the right machine first.</p><h2>Best fit</h2><p>Multi-line plants with a small maintenance crew.</p><h2>The one line</h2><div class="note">Know which machine is about to stop, and what to check, days before it does.</div><p>Every headline, ad and first slide should be a version of that line, said in the reader's words.</p>`},
  {id:'competitors', sec:'Go-to-market', t:'Competitors', own:'lena', upd:'Oct 16', used:['pmm','sales','content'], body:`<table><thead><tr><th></th><th>Fabrix</th><th>Linewise</th><th>Spreadsheets</th></tr></thead><tbody><tr><td><b>Who</b></td><td>Single-site shops</td><td>Big plants, enterprise</td><td>Everyone else</td></tr><tr><td><b>Price</b></td><td>From $499 a month</td><td>$250,000 or more</td><td>Free, plus every stop</td></tr><tr><td><b>Strength</b></td><td>Cheap and quick</td><td>Does everything</td><td>Nothing to buy</td></tr><tr><td><b>Weakness</b></td><td>One site, alerts without a cause</td><td>6-month installs</td><td>Finds problems after the stop</td></tr><tr><td><b>How we win</b></td><td>Multi-line plants. Ask what their techs do when it alerts.</td><td>Speed and price for mid-size plants</td><td>The cost of one stop</td></tr></tbody></table><p>Battlecards with sources live in Files, Sales Enablement. Product Marketing Lead checks competitor sites every Monday.</p>`},
  {id:'sales-process', sec:'Go-to-market', t:'Sales process', own:'marcus', upd:'Oct 2', used:['sales','revops'], body:`<table><thead><tr><th>Stage</th><th>Done when</th></tr></thead><tbody><tr><td>Discovery</td><td>We know their worst line and what an hour of downtime costs them</td></tr><tr><td>Demo</td><td>The maintenance lead was in the room</td></tr><tr><td>Pilot</td><td>Paid pilot signed, with success written down</td></tr><tr><td>Proposal</td><td>The VP of operations and finance have the numbers</td></tr><tr><td>Negotiation</td><td>Terms agreed, legal review started</td></tr><tr><td>Closed</td><td>Signed, install date booked</td></tr></tbody></table><h2>Rules</h2><ul><li>Every deal has a next step with a date. Sales Desk flags the ones that don't.</li><li>Sales Desk sends a prep pack an hour before every call.</li><li>Pricing exceptions go to Marcus.</li></ul>`},
  {id:'claims', sec:'Go-to-market', t:'Approved claims', own:'priya', upd:'Oct 15', used:['content','demand','pmm','brand','sales'], body:`<p>The only numbers anyone, person or AI teammate, may use. Each one has a source and a place it's allowed.</p><table><thead><tr><th>Claim</th><th>Source</th><th>Use it in</th></tr></thead><tbody><tr><td>Spots drift up to 9 days before a stop</td><td>Alert data, 41 plants, 2025</td><td>Anywhere</td></tr><tr><td>Unplanned stops down 38% on average in 6 months</td><td>Customer data, 22 plants, Jan 2026</td><td>Anywhere</td></tr><tr><td>Installed in a day per line</td><td>Install logs, 2025</td><td>Anywhere</td></tr><tr><td>Midstate Foods: 11 stops avoided in 90 days</td><td>Customer-approved, Aug 2026</td><td>Anywhere, with logo</td></tr><tr><td>Payback under 6 months</td><td>Finance model, 18 customers</td><td>Sales conversations only, not ads</td></tr></tbody></table><div class="note">Not on this page? Don't use it. Ask Product Marketing Lead to add it, with its source. Drafts with an unsourced number get flagged before anyone sees them.</div>`},
  {id:'stories', sec:'Go-to-market', t:'Customer stories', own:'priya', upd:'Oct 15', used:['content','sales','demand'], body:`<h2>Midstate Foods, Columbus, Ohio</h2><ul><li>Snack maker, 2 plants, food and beverage</li><li>11 stops avoided in the first 90 days</li><li>Ana Ruiz, plant manager: "My techs go straight to the right machine now."</li><li>Approved for logo, quote and numbers</li></ul><h2>Northline Packaging, Wisconsin</h2><ul><li>Corrugated packaging, 3 plants</li><li>Started with one line, on all three sites within 8 months</li><li>Approved for logo and the expansion story. No numbers yet.</li></ul><h2>Stamping shop, Indiana</h2><ul><li>Metal fabrication, 3 sites</li><li>Two press bearing failures caught in the first month</li><li>Can't be named. Describe it, don't name it.</li></ul>`},
  {id:'words', sec:'Brand', t:'Words we use', own:'priya', upd:'Oct 5', used:['content','demand','brand','pmm'], body:`<table><thead><tr><th>Say</th><th>Not</th></tr></thead><tbody><tr><td>Line stop</td><td>Downtime event</td></tr><tr><td>Plant</td><td>Facility</td></tr><tr><td>Maintenance crew</td><td>Resources</td></tr><tr><td>A catch (an alert that prevented a stop)</td><td>A prediction</td></tr><tr><td>What to check</td><td>Insights</td></tr></tbody></table><h2>Never</h2><p>Unlock, leverage, revolutionize, seamless, game-changing, and "AI-powered" in a headline.</p>`},

function finished(c){

  if(c.type==='pitch'){ const d = S.done[c.id]; return d ? [d==='yes'?'Going ahead':'Not now', PITCH[c.id].t, d==='yes'?`${nameOf(PITCH[c.id].by)} reports back here`:''] : null; }
  if(c.type==='choice' && c.ans!==undefined) return ['Answered', c.q, c.o[c.ans]];
  if(c.type==='plan' && c.done) return ['Started', c.name||'Midwest Plant Expo', c.pid?'on the calendar and the timeline':'6 jobs with the Events Lead'];
  if(c.type==='sig' && c.done) return ['Installed', 'Your email signature', 'copy saved in Brand/Signatures'];
  if(c.type==='setup' && isOn(c.slot)) return ['Connected', SL[c.slot].n, tool(c.slot)];
  if(c.type==='change'){ const p = S.props[c.id]; if(p && ['applied','dismissed','undone'].includes(p.status)) return [{applied:'Applied', dismissed:'Not applied', undone:'Undone'}[p.status], `Change to ${AG[p.a].n}'s settings`, '', p.status==='applied'?`<button class="link" data-a="undo" data-id="${c.id}">Undo</button>`:'']; }
  return null;
}

function mapPanel(a){

      const br = n.k==='check' ? `<div class="nd">Yes: ${esc(n.yes)} · No: ${esc(n.no)}</div>` : '';
      const insp = open && (n.m||n.p||n.k==='gate') ? `<div class="insp" data-stop>${ro?`<p class="why">${ic('lock',12)} Only admins can edit. Ask ${esc(a.n)} in chat and it goes to Priya.</p>`:''}

let PID = 0;
function propose(a, t){
  const L = t.toLowerCase();
  const findJob = () => a.jobs.find(j=>j.n.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>3).some(w=>L.includes(w))) || a.jobs[0];
  let c = null;
  const isRule = /^(never|always|don.t|do not|stop|avoid|make sure)\b/.test(L);
  if(/hashtag/.test(L) && a.id==='content'){
    const k='content.linkedin.2', cur=S.edits[k]??MAPS.linkedin[2].p;
    c = {title:'LinkedIn posts: no hashtags', rows:[['Company LinkedIn post › Write step › Prompt','Two hashtags at most.','No hashtags.']], set:{type:'edit', k, job:'content.linkedin', val:cur.replace('Two hashtags at most.','No hashtags.'), prev:S.edits[k]}};
  } else if(!isRule && /without ask|stop asking|don.t ask|on your own|automatically|no need to ask/.test(L)){
    const j=findJob(), k=a.id+'.'+j.id, cur=lvlOf(a,j), nx=Math.min(3,cur+1);
    c = {title:`${j.n}: ${LV[nx].toLowerCase()}`, rows:[[`${j.n} › Autonomy`,LV[cur],LV[nx]]], set:{type:'lvl', k, val:nx, prev:S.lvl[k]}};
  } else if(/ask me first|check with me|run it by me/.test(L)){
    const j=findJob(), k=a.id+'.'+j.id, cur=lvlOf(a,j), nx=Math.max(0,cur-1);
    c = {title:`${j.n}: ${LV[nx].toLowerCase()}`, rows:[[`${j.n} › Autonomy`,LV[cur],LV[nx]]], set:{type:'lvl', k, val:nx, prev:S.lvl[k]}};
  } else if(!isRule && /every (morning|day|week|monday|tuesday|wednesday|thursday|friday)|mondays at|daily at/.test(L)){
    const when = (t.match(/(every \w+( at \d{1,2}(:\d\d)?\s?(am|pm)?)?|mondays at \d{1,2}|daily at \d{1,2})/i)||['Weekly'])[0];
    c = {title:'New routine', rows:[['Routines › new','(none)', t]], set:{type:'rout', val:[when.replace(/^\w/,x=>x.toUpperCase()), t]}};
  } else if(isRule || /\b(never|always|from now on|instead)\b/.test(L)){
    c = {title:'New house rule', rows:[['House rules › every job','(none)', t]], set:{type:'rule', val:t}};
  }
  if(!c) return null;
  const id = 'c'+(++PID);
  S.props[id] = Object.assign(c, {id, a:a.id, ask:t, by:H[S.me].n, status:isAdmin()?'open':'queued'});
  if(!isAdmin()){ if(!S.convs['cos:priya']){ const s=S.me; S.me='priya'; seed('cos'); S.me=s; } S.convs['cos:priya'].push({f:'cos', x:`${H[S.me].n} asked ${a.n} to change how it works. Your call.`, cards:[{type:'change', id}]}); }
  return id;
}
function applyChange(id){
  const c = S.props[id]; if(!c || c.status==='applied') return; const z = c.set;
  if(z.type==='edit'){ S.edits[z.k]=z.val; S.edits[z.job]=true; }
  if(z.type==='lvl') S.lvl[z.k]=z.val;
  if(z.type==='rout') (S.extraRout[c.a]=S.extraRout[c.a]||[]).push(z.val);
  if(z.type==='rule') (S.rules[c.a]=S.rules[c.a]||[]).push(z.val);
  c.status='applied';
  (S.hist[c.a]=S.hist[c.a]||[]).push({id, title:c.title, who:c.by, when:'Just now'});
}
function undoChange(id){
  const c = S.props[id], z = c.set;
  if(z.type==='edit'){ if(z.prev===undefined){ delete S.edits[z.k]; delete S.edits[z.job]; } else S.edits[z.k]=z.prev; }
  if(z.type==='lvl'){ if(z.prev===undefined) delete S.lvl[z.k]; else S.lvl[z.k]=z.prev; }
  if(z.type==='rout') S.extraRout[c.a]=(S.extraRout[c.a]||[]).filter(r=>r!==z.val);
  if(z.type==='rule') S.rules[c.a]=(S.rules[c.a]||[]).filter(r=>r!==z.val);
  c.status='undone'; const h=(S.hist[c.a]||[]).find(x=>x.id===id); if(h) h.undone=true;
}

function mirrorItems(gid){
  const out = [], msgs = seed('g:'+gid);
  const refd = new Set(msgs.flatMap(m=>(m.cards||[]).filter(c=>c.type==='post').map(c=>c.id)));
  PROJECTS.filter(p=>p.grp===gid && !refd.has(p.id)).forEach(p=>out.push({f:p.lead, x:`New project: ${p.n}. ${p.when}.`, post:p.id, mi:-1}));
  msgs.forEach((m,mi)=>{ if(!m.f || m.typing) return; const pc=(m.cards||[]).find(c=>c.type==='post'); out.push(Object.assign({}, m, {mi, post:pc?pc.id:null, cards:(m.cards||[]).filter(c=>c.type!=='post')})); });
  return out;
}

function mirrorSend(t, conv, via){
  if(via==='Slack' && /^\/(ask|cos)\s/.test(t)){
    const q = t.replace(/^\/(ask|cos)\s+/,''), list = (S.eph[conv] = S.eph[conv]||[]);

    return;
  }
  send(t, conv, via);
}

    case 'team': o.c.email = o.c.email || 'Microsoft 365'; o.c.storage = o.c.storage || 'SharePoint'; o.c.comms = o.c.comms || 'Right here'; onbSay(`Add ${o.team.length} teammates`, 'Three connections get everything running. I\'ve already found most of them.', 'connect', 4); break;

    case 'person': o.people[+v].on = !o.people[+v].on; render(true); break;

}

// Full-width chart with an emphasized bar, a value on every bar, gridlines, a goal line, hover and focus values, and a table view
function bigChart(id, hl){
  const c = CHARTS[id], fmt = v => `${c.pre||''}${Number(v).toLocaleString('en-US')}${c.unit||c.tl||''}`, n = c.data.length;
  const h = hl===undefined ? -1 : hl < 0 ? -1 : hl;
  let plot = '';
  if(c.kind==='hbar'){ const max = Math.max(...c.data.map(d=>d[1]));
    plot = `<div class="bh">${c.data.map((d,i)=>`<span class="l">${esc(d[0])}</span><span class="tr" tabindex="0" data-tip="${esc(d[0])}: ${esc(fmt(d[1]))}"><i class="${h<0||i===h?'hl':''}" style="width:${Math.max(.5, d[1]/max*100)}%"></i></span><span class="v ${i===h?'b':''}">${esc(fmt(d[1]))}</span>`).join('')}</div>`;
  } else { const top = Math.max(c.goal||0, ...c.data.map(d=>d[1])) * 1.08, mag = Math.pow(10, Math.floor(Math.log10(top/4))), step = [1,2,5,10].map(x=>x*mag).find(x=>top/x<=5), max = Math.ceil(top/step)*step, ticks = Array.from({length:Math.round(max/step)+1}, (_,i)=>i*step);
    plot = `<div class="bc">${ticks.map(t=>`<div class="gl" style="bottom:${t/max*100}%"><span>${esc(fmt(t))}</span></div>`).join('')}${c.goal?`<div class="goal" style="bottom:${c.goal/max*100}%"><span>Goal ${esc(fmt(c.goal))}</span></div>`:''}<div class="bcs">${c.data.map((d,i)=>{ const on = h<0 ? i===n-1 : i===h; return `<div class="c" tabindex="0" data-tip="${esc(d[0])}: ${esc(fmt(d[1]))}"><i class="${on?'hl':''}" style="height:${d[1]/max*100}%"></i>${on?`<b style="bottom:calc(${d[1]/max*100}% + 4px)">${esc(fmt(d[1]))}</b>`:''}<span>${esc(d[0])}</span></div>`; }).join('')}</div></div>`; }
  return `<figure class="rfig"><figcaption><h3>${esc(c.t)}</h3><span class="faint">${esc(c.sub)}</span></figcaption>${plot}<div class="rfoot"><span class="faint">Source: ${esc(fill(c.src))}</span><details><summary>Show the numbers</summary><table class="dtable"><tbody>${c.data.map(d=>`<tr><td>${esc(d[0])}</td><td class="tnum" style="text-align:right">${esc(fmt(d[1]))}</td></tr>`).join('')}</tbody></table></details></div></figure>`;
}

// A question that a wiki page answers gets that page's best line, with the page as its source
function wikiAnswer(q){
  const STOP = new Set(['what','where','when','which','does','have','with','about','that','this','from','your','our','how','who','the','and','for','can','you','are','its']);
  const terms = q.toLowerCase().replace(/\?/g,'').split(/[^a-z0-9$]+/).filter(w=>w.length>2 && !STOP.has(w)).map(w=>w.replace(/(ing|es|s)$/,''));
  if(terms.length<1) return null;
  const hits = txt => { const t = txt.toLowerCase(); return terms.filter(w=>t.includes(w)).length; };
  let best = null;
  WIKI.forEach(w=>{ const ls = plain(w.body), sc = hits(w.t)*3 + hits(ls.join(' ')); if(sc>=3 && (!best || sc>best.sc)) best = {w, sc, line: ls.slice().sort((a,b)=>hits(b)-hits(a))[0]}; });
  return best && {x: best.line, rows:[`<button class="link" data-a="qswiki" data-v="${best.w.id}">${ic('book',13)} From ${esc(best.w.t)} · open the page</button>`]};
}

  el.classList.add('kbfocus'); el.setAttribute('tabindex','-1'); el.focus({preventScroll:true}); el.scrollIntoView({block:'nearest'});
}
const KEYS = [['⌘K','Search, or ask your Assistant'],['⌘J','Ask your Assistant (right on the page you\'re on)'],['⌘1 to ⌘8','Switch workspace'],['⌘I','Show or hide details'],['J and K','Move down and up a list'],['Enter','Open the highlighted item'],['A','Approve the highlighted item'],['Esc','Close whatever is open'],['?','Show this list']];
document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if(!typing && !e.metaKey && !e.ctrlKey && !e.altKey && !S.onb.on){
    if(e.key==='j' || e.key==='k'){ e.preventDefault(); kbMove(e.key==='j'?1:-1); return; }
    if(e.key==='?'){ e.preventDefault(); S.pop = S.pop==='keys' ? null : 'keys'; renderTop(); return; }
    const f = document.querySelector('.kbfocus');
    if(f && e.key==='Enter' && f.matches('.kcard,.mrow,tr.click')){ e.preventDefault(); f.click(); return; }
    if(f && (e.key==='a' || e.key==='Enter')){ const b = f.querySelector('.btn:not(.ghost):not(:disabled)'); if(b){ e.preventDefault(); b.click(); return; } }
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='i' && S.mode==='chat' && !S.onb.on){ e.preventDefault(); S.info=!S.info; render(true); return; }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='i' && S.mode!=='chat' && !S.onb.on){ e.preventDefault(); S.info=!S.info; render(true); return; }
  if(e.key==='Enter' && !e.shiftKey && e.target.id==='askta'){ e.preventDefault(); e.target.closest('form').requestSubmit(); return; }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='j' && !S.onb.on){ e.preventDefault(); if(S.mode!=='chat' && S.mode!=='today' && !S.settings){ S.ask.open=!S.ask.open; render(true); const a=document.getElementById('askta'); if(a&&S.ask.open) a.focus(); return; } const b = S.mode!=='chat' ? {mode:S.mode, deal:S.deal, cust:S.cust} : null; S.pop=null; openConv('cos'); if(b) S.back = b; render(); const ta=document.getElementById('ta'); if(ta) ta.focus(); return; }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); if(S.onb.on) return; const q=document.getElementById('qs'); q.focus(); q.select(); S.pop='search'; renderTop(); return; }
  if(e.target.id==='qs'){
    if(e.key==='ArrowDown'){ e.preventDefault(); S.qsi=Math.min(S.qsi+1, QS.length-1); renderQS(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); S.qsi=Math.max(S.qsi-1, 0); renderQS(); return; }
    if(e.key==='Enter'){ e.preventDefault(); const x=QS[S.qsi]; if(!x) return; const go=x.go; S.pop=null; e.target.blur(); go(); S.qs=''; e.target.value=''; renderTop(); return; }
    if(e.key==='Escape'){ S.pop=null; e.target.blur(); renderTop(); return; }
  }

  if((e.metaKey||e.ctrlKey||(e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) && /^[1-8]$/.test(e.key) && !S.onb.on){ e.preventDefault(); railGo(RAIL[+e.key-1]); return; }
  if(e.target.id==='ta'){ const mp=document.getElementById('mpop'); if(mp && !mp.hidden && (e.key==='Enter'||e.key==='Tab')){ e.preventDefault(); mp.querySelector('.ir').click(); return; } if(mp && !mp.hidden && e.key==='Escape'){ mp.hidden=true; return; } }
  if(e.key==='Enter' && e.target.matches('.inl input')){ e.preventDefault(); e.target.parentElement.querySelector('.btn').click(); return; }
  if(e.key==='Enter' && !e.shiftKey && e.target.matches('.mta')){ e.preventDefault(); e.target.closest('form').requestSubmit(); return; }
  if(e.key==='Enter' && !e.shiftKey && e.target.id==='ta'){ e.preventDefault(); e.target.closest('form').requestSubmit(); }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('.nb')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Escape' && S.pop){ S.pop=null; renderTop(); return; }
  if(e.key==='Escape' && S.ask.open && S.mode!=='chat'){ S.ask.open=false; render(true); return; }
  if(e.key==='Escape'){ document.getElementById('app').classList.remove('side-open'); if(S.info){ S.info=false; render(true); } }
});
document.addEventListener('submit', e=>{ e.preventDefault();
  if(e.target.id==='askform'){ const a=document.getElementById('askta'), v=a.value.trim(); if(v){ a.value=''; askSend(v); } return; }
  const f=e.target, ta=f.querySelector('textarea,input'); const t=ta.value.trim(); if(!t) return; ta.value='';
  if(f.dataset.via){ mirrorSend(t, f.dataset.conv, f.dataset.via); return; }
  if(S.conv==='today' || S.mode==='today'){ openConv('cos'); send(t); return; }
  if(S.onb.on){ if(S.onb.step===0) onbDo({do:'site', v:t}); else onbSay(t, 'Got it. I\'ll fold that in. Carry on whenever you\'re ready.'); return; }
  if(S.conv.startsWith('g:') && gview(S.conv.slice(2))==='posts') S.gview[S.conv.slice(2)]='chat';
  send(t); });
S.onb = freshOnb();
render();
